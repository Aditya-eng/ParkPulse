[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkpulse"
version = "0.1.0"
description = "Live parking and congestion intelligence for Jammu from existing city cameras (prototype)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-learn>=1.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["parkpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
